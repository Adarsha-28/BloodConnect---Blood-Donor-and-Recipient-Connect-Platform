# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blooddonation}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:your_db_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Settings
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}


# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,metrics

# Logging levels
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.blooddonation=DEBUG
